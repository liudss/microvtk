name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    name: Clang-Tidy
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Restore dependency caches
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.CPM_SOURCE_CACHE }}
          ${{ env.CCACHE_DIR }}
        key: ${{ runner.os }}-clang-tidy-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-clang-tidy-

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang clang-tidy ccache ninja-build

    - name: Configure CMake
      run: |
        cmake --preset clang-tidy \
          -D CMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Run clang-tidy build
      run: cmake --build --preset clang-tidy --target microvtk_ide_headers --parallel

    - name: Show ccache stats
      run: ccache --show-stats

  build-linux:
    name: Linux (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [debug, release]
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Restore dependency caches
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.CPM_SOURCE_CACHE }}
          ${{ env.CCACHE_DIR }}
        key: ${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-
          ${{ runner.os }}-${{ matrix.compiler }}-
          ${{ runner.os }}-

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache ninja-build valgrind

    - name: Setup Compiler Environment
      run: |
        if [ "${{ matrix.compiler }}" = "gcc" ]; then
          echo "CC=gcc" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV
        else
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
        fi

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version-file: .python-version

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Configure CMake
      run: |
        cmake --preset ${{ matrix.build_type }} \
          -D CMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -D MICROVTK_BUILD_BENCHMARKS=OFF

    - name: Build
      run: cmake --build --preset ${{ matrix.build_type }} --parallel

    - name: Test
      run: ctest --test-dir build/${{ matrix.build_type }} --output-on-failure --parallel
      env:
        MICROVTK_USE_VALGRIND: ON

    - name: Show ccache stats
      run: ccache --show-stats

  install-export-smoke:
    name: CMake install/export smoke
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build

    - name: Configure install tree
      run: |
        cmake -S . -B build/install-smoke -G Ninja \
          -D CMAKE_BUILD_TYPE=Release \
          -D CMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/microvtk-install" \
          -D MICROVTK_BUILD_TESTS=OFF \
          -D MICROVTK_BUILD_EXAMPLES=OFF \
          -D MICROVTK_BUILD_BENCHMARKS=OFF \
          -D MICROVTK_USE_ZLIB=OFF \
          -D MICROVTK_USE_LZ4=OFF \
          -D MICROVTK_USE_KOKKOS=OFF \
          -D MICROVTK_USE_CABANA=OFF \
          -D MICROVTK_USE_CPM=OFF \
          -D MICROVTK_INSTALL=ON

    - name: Install package
      run: cmake --build build/install-smoke --target install

    - name: Create consumer project
      run: |
        cmake -E make_directory "${RUNNER_TEMP}/microvtk-consumer"
        cat > "${RUNNER_TEMP}/microvtk-consumer/CMakeLists.txt" <<'EOF'
        cmake_minimum_required(VERSION 3.25)
        project(microvtk_consumer_smoke LANGUAGES CXX)

        set(CMAKE_CXX_STANDARD 20)
        set(CMAKE_CXX_STANDARD_REQUIRED ON)
        set(CMAKE_CXX_EXTENSIONS OFF)

        find_package(microvtk CONFIG REQUIRED)

        add_executable(consumer main.cpp)
        target_link_libraries(consumer PRIVATE microvtk::microvtk)
        EOF
        cat > "${RUNNER_TEMP}/microvtk-consumer/main.cpp" <<'EOF'
        #include <microvtk/microvtk.hpp>

        int main() {
            microvtk::PvdWriter writer("smoke.pvd");
            writer.addStep(0.0, "smoke.vtu");
            return 0;
        }
        EOF

    - name: Build consumer project
      run: |
        cmake -S "${RUNNER_TEMP}/microvtk-consumer" \
          -B "${RUNNER_TEMP}/microvtk-consumer-build" \
          -G Ninja \
          -D CMAKE_PREFIX_PATH="${RUNNER_TEMP}/microvtk-install"
        cmake --build "${RUNNER_TEMP}/microvtk-consumer-build"

  build-windows:
    name: Windows (MSVC)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version-file: .python-version

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Configure CMake
      run: cmake --preset msvc-debug -D MICROVTK_BUILD_BENCHMARKS=OFF

    - name: Build
      run: cmake --build --preset msvc-debug --parallel

    - name: Test
      run: ctest --preset msvc-tests --parallel
