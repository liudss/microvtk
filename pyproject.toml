[build-system]
requires = [
    "scikit-build-core>=0.12",
    "nanobind>=2.4",
]
build-backend = "scikit_build_core.build"

[project]
name = "microvtk"
version = "0.1.0"
description = "Header-only C++20 library for zero-copy streaming of simulation data into VTK formats"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
dependencies = [
    "numpy>=1.22",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "vtk>=9.0.0",
]

[dependency-groups]
test = [
    "pytest>=7.0.0",
    "vtk>=9.0.0",
]

[tool.scikit-build]
cmake.args = ["-DMICROVTK_ENABLE_PYTHON=ON"]
build-dir = "build/{wheel_tag}"

[tool.scikit-build.wheel]
packages = ["python/microvtk"]

[tool.pytest.ini_options]
testpaths = ["tests/integration"]
python_files = "test_*.py"
markers = [
    "integration: mark a test as an integration test."
]
